[package]
name = "pc-control-windows-setup"
version = "0.1.0"
description = "PC Control for Windows setup utility"
authors = ["PC Control"]
edition = "2021"

[lib]
name = "pc_control_windows_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
tiny_http = "0.12"
mdns-sd = "0.21"
rsa = { version = "0.9", features = ["sha2"] }
